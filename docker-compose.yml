services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - catalogue
  solr:
    build: "solr"
    ports:
      - "8983:8983"
  mapserver:
    image: camptocamp/mapserver:8.0
    environment:
      MAPSERVER_BASE_PATH: /mapserver
      MS_MAP_PATTERN: "^\\/maps\\/([^\\.][-_A-Za-z0-9\\.]+\\/{1})*([-_A-Za-z0-9\\.]+)$$"
    ports:
      - "9000:80"
    volumes:
      - mapfiles:/maps
      - ./fixtures/mapserver-data:/data
  hubbub-db:
    image: postgres:14.1-alpine
    environment:
      POSTGRES_PASSWORD: &db_password cabbages
      POSTGRES_USER: &db_user gardener
      POSTGRES_DB: hubbub
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5432:5432"
    profiles: [hubbub]
  # Copied from hubbub-db above rather than invented: same image and tag, same localtime mount, same
  # shape, and behind a compose profile in the same way.
  #
  # Host port 5434, not 5432: hubbub-db takes 5432, and although that one is also profiled,
  # `docker compose --profile hubbub --profile metrics up` has to be able to run both. The container
  # port stays 5432, so only the host-side URL differs.
  #
  # Storage is ephemeral, as hubbub-db's is -- no named volume, so the data goes when the container
  # does. That is the pattern here, and the metrics tables are recreated at startup today. Revisit
  # once Flyway owns the schema (#235) if a persistent local database turns out to be useful.
  metrics-db:
    image: postgres:14.1-alpine
    environment:
      POSTGRES_PASSWORD: &metrics_db_password metrics
      POSTGRES_USER: &metrics_db_user metrics
      POSTGRES_DB: metrics
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5434:5432"
    profiles: [metrics]
  hubbub:
    image: registry.gitlab.ceh.ac.uk/eip/hubbub:7.22.0
    depends_on:
      - hubbub-db
    environment:
      DB_HOST: hubbub-db
      DB_PASSWORD: *db_password
      DB_USER: *db_user
    ports:
      - '8082:8080'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - dropbox:/mnt/dropbox
      - ./fixtures/upload/eidchub:/mnt/eidchub
      - ./fixtures/upload/supporting-documents:/mnt/supporting-documents
    profiles: [hubbub]
  legilo:
    image: cehappdev/legilo:latest
    pull_policy: always
    environment:
      DATA_DIR: /opt/data
      SUPPORTING_DOCS_DIR: /opt/supporting-docs
      DROPBOX_DIR: /opt/dropbox
    ports:
      - "8000:8000"
    volumes:
      - ./fixtures/upload/eidchub:/opt/data
      - ./fixtures/upload/supporting-documents:/opt/supporting-docs
      - ./fixtures/upload/dropbox:/opt/dropbox
    profiles: [legilo]
  fuseki:
    image: registry.gitlab.ceh.ac.uk/eip/fuseki:4.9.0-ceh2
    environment:
      ADMIN_PASSWORD: admin
    ports:
      - '3030:3030'
    profiles: [fuseki]
  catalogue:
    build:
      context: .
      target: dev-run
    volumes:
      - ./:/app
      - datastore:/var/ceh-catalogue/datastore
      - jena-data:/var/ceh-catalogue/jena
      - gradle-cache:/home/gradle/.gradle
      - metrics-db:/var/ceh-catalogue/metrics-db
    environment:
      DOCUMENTS_BASEURI: http://localhost:8080
      DOI_API: https://api.test.datacite.org/dois
      GEMET_LOCAL: /app/fixtures/vocabs/gemet.json
      ROR_LOCAL: /app/fixtures/solr/ror
      HUBBUB_LOCATION: /app/dropbox
      HUBBUB_URL: http://localhost:8082/v7
      JENA_LOCATION: /var/ceh-catalogue/jena
      JIRA_SERVICEAGREEMENT_PREFIX: "CT-"
      JIRA_DEPOSITREQUEST_PROJECT: CT
      LOGGING_LEVEL_ROOT: info
      MAPS_LOCATION: /app/mapfiles
      # Interpolated, defaulting to sqlite to match the application default, so that a plain
      # `docker compose up` -- which does not start metrics-db -- is self-consistent rather than
      # pointing at a database that is not running.
      #
      # The compose profile and this variable are two separate switches and have to be set together.
      # Put both in the .env file beside this one, which compose reads for interpolation and for
      # COMPOSE_PROFILES, so it is a single edit:
      #
      #     COMPOSE_PROFILES=metrics
      #     METRICS_DATABASE_ENGINE=postgres
      #
      # or, one-off:  METRICS_DATABASE_ENGINE=postgres docker compose --profile metrics up
      METRICS_DATABASE_ENGINE: postgres
      # Both engines' settings are present at once, on separate variables, so switching between them
      # is a one-value change. METRICS_DATABASE_URL is the sqlite path (was the only setting here
      # before); METRICS_DATASOURCE_* feeds spring.datasource.* on the postgres path, over the compose
      # network, so the container port applies rather than the 5434 published to the host. Credentials
      # come from the same anchors the service is defined with, as hubbub does.
      METRICS_DATASOURCE_URL: jdbc:postgresql://metrics-db:5432/metrics
      METRICS_DATASOURCE_USERNAME: *metrics_db_user
      METRICS_DATASOURCE_PASSWORD: *metrics_db_password
      SERVER_PORT: "8090"
      SPRING_FREEMARKER_CACHE: "false"
      SPRING_FREEMARKER_TEMPLATE_LOADER_PATH: file:/app/templates
      SPRING_SERVLET_MULTIPART_LOCATION: /app/dropbox
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: file:/app/static
      UPLOAD_SIMPLE_DATASTORE: /var/ceh-catalogue/datastore
      LEGILO_URL: http://legilo:8000
      LEGILO_USER: user
      LEGILO_PASSWORD: password
      FUSEKI_SPARQL_ENDPOINT: http://fuseki:3030/ds/sparql
      FUSEKI_DATASET_URL: http://fuseki:3030/ds
      # "metrics" (Spring profile, unrelated to the compose profile above) added: it was not active
      # locally, so MetricsDatabaseConfig and JDBCMetricsService were never built here and
      # METRICS_DATABASE_URL was inert. It is in EIDC's SPRING_PROFILES_ACTIVE in production, so this
      # also brings local dev closer to what actually runs. Left on unconditionally: under the default
      # sqlite engine it needs nothing external, exactly as before this change.
      SPRING_PROFILES_ACTIVE: development,server-eidc,search-basic,service-agreement,upload-simple,metrics
    env_file:
      - path: secrets.env
        required: false
      - path: override.env
        required: false
    ports:
      - "8090:8090"
      - "8091:8091"
    depends_on:
      solr:
        condition: service_started
      # required: false is what lets metrics-db be profiled. Without it, `docker compose up` without
      # the metrics profile fails outright -- "service metrics-db is required by catalogue but is
      # disabled" -- because compose does not activate a dependency's profile for it. With it, an
      # inactive metrics-db is a warning and the catalogue starts anyway, which is the intended
      # behaviour under the default sqlite engine.
      #
      # Start ordering only when it IS active, as hubbub has on hubbub-db -- not a readiness gate.
      # Safe because on the postgres path the catalogue is configured to start with the metrics
      # database unavailable (spring.datasource.hikari.initialization-fail-timeout=-1); it connects
      # when the database accepts connections. If PostgreSQL is still initialising, the first record
      # page renders without counts rather than failing.
      metrics-db:
        condition: service_started
        required: false
    develop:
      watch:
        - action: rebuild
          path: ./build.gradle
        - action: rebuild
          path: ./gradle/libs.versions.toml
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./docker/entrypoint-dev.sh
  web:
    image: node:24-alpine
    # Run as the image's node user (UID 1000) so files written into the bind-mounted
    # ./web (node_modules, css, dist) are owned by the host user, not root.
    user: node
    working_dir: /app/web
    environment:
      # node user's HOME may be unset under an explicit user:, so point npm at a writable cache.
      npm_config_cache: /tmp/.npm
    volumes:
      - ./web:/app/web
    command: sh -c "npm install && (npm run watch & npm run watch-css)"
volumes:
  dropbox:
  mapfiles:
  datastore:
  jena-data:
  gradle-cache:
  metrics-db:
