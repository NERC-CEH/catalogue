services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
  solr:
    build: "solr"
    ports:
      - "8983:8983"
  mapserver:
    image: registry.gitlab.ceh.ac.uk/eip/mapserver:2
    ports:
      - "9000:80"
    volumes:
      - mapfiles:/mapserver/maps
      - ./fixtures/mapserver-data:/mapserver/data
  hubbub-db:
    image: postgres:14.1-alpine
    environment:
      POSTGRES_PASSWORD: &db_password cabbages
      POSTGRES_USER: &db_user gardener
      POSTGRES_DB: hubbub
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5432:5432"
    profiles: [hubbub]
  hubbub:
    image: registry.gitlab.ceh.ac.uk/eip/hubbub:7.19.0
    depends_on:
      - hubbub-db
    environment:
      DB_HOST: hubbub-db
      DB_PASSWORD: *db_password
      DB_USER: *db_user
    ports:
      - '8082:8080'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - dropbox:/mnt/dropbox
      - ./fixtures/upload/eidchub:/mnt/eidchub
      - ./fixtures/upload/supporting-documents:/mnt/supporting-documents
    profiles: [hubbub]
  legilo:
    image: cehappdev/legilo:latest
    pull_policy: always
    environment:
      DATA_DIR: /opt/data
      SUPPORTING_DOCS_DIR: /opt/supporting-docs
      DROPBOX_DIR: /opt/dropbox
    ports:
      - "8000:8000"
    volumes:
      - ./fixtures/upload/eidchub:/opt/data
      - ./fixtures/upload/supporting-documents:/opt/supporting-docs
      - ./fixtures/upload/dropbox:/opt/dropbox
    profiles: [legilo]
  fuseki:
    image: registry.gitlab.ceh.ac.uk/eip/fuseki:4.9.0-ceh2
    environment:
      ADMIN_PASSWORD: admin
    ports:
      - '3030:3030'
    profiles: [fuseki]
volumes:
  dropbox:
  mapfiles:
