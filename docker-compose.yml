services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - catalogue
  solr:
    build: "solr"
    ports:
      - "8983:8983"
  mapserver:
    image: camptocamp/mapserver:8.0
    environment:
      MAPSERVER_BASE_PATH: /mapserver
      MS_MAP_PATTERN: "^\\/maps\\/([^\\.][-_A-Za-z0-9\\.]+\\/{1})*([-_A-Za-z0-9\\.]+)$$"
    ports:
      - "9000:80"
    volumes:
      # The catalogue writes its mapfiles to MAPS_LOCATION (/app/mapfiles), i.e. ./mapfiles
      - ./mapfiles:/maps:ro
      - ./fixtures/mapserver-data:/data
  hubbub-db:
    image: postgres:14.1-alpine
    environment:
      POSTGRES_PASSWORD: &db_password cabbages
      POSTGRES_USER: &db_user gardener
      POSTGRES_DB: hubbub
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Run only on an empty data directory: the schema and status rows, then seed_files.sql, which
      # registers the fixture files the local data preview lists. The image keeps its data in an
      # anonymous volume that survives a recreate, so after `docker compose down` or with
      # `docker compose --profile hubbub up -V hubbub-db` for a database that predates this mount.
      - ./fixtures/hubbub/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    profiles: [hubbub]
  catalogue-db:
    image: postgres:14.24-alpine
    environment:
      POSTGRES_PASSWORD: &catalogue_db_password catalogue
      POSTGRES_USER: &catalogue_db_user catalogue
      POSTGRES_DB: catalogue
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - catalogue-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogue -d catalogue"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: [postgres]
  hubbub:
    image: registry.gitlab.ceh.ac.uk/eip/hubbub:7.22.0
    depends_on:
      - hubbub-db
    environment:
      DB_HOST: hubbub-db
      DB_PASSWORD: *db_password
      DB_USER: *db_user
    ports:
      - '8082:8080'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - dropbox:/mnt/dropbox
      - ./fixtures/upload/eidchub:/mnt/eidchub
      - ./fixtures/upload/supporting-documents:/mnt/supporting-documents
    profiles: [hubbub]
  legilo:
    image: cehappdev/legilo:latest
    pull_policy: always
    environment:
      DATA_DIR: /opt/data
      SUPPORTING_DOCS_DIR: /opt/supporting-docs
      DROPBOX_DIR: /opt/dropbox
    ports:
      - "8000:8000"
    volumes:
      - ./fixtures/upload/eidchub:/opt/data
      - ./fixtures/upload/supporting-documents:/opt/supporting-docs
      - ./fixtures/upload/dropbox:/opt/dropbox
    profiles: [legilo]
  fuseki:
    image: registry.gitlab.ceh.ac.uk/eip/fuseki:4.9.0-ceh2
    environment:
      ADMIN_PASSWORD: admin
    ports:
      - '3030:3030'
    profiles: [fuseki]
  catalogue:
    build:
      context: .
      target: dev-run
    volumes:
      - ./:/app
      - datastore:/var/ceh-catalogue/datastore
      - jena-data:/var/ceh-catalogue/jena
      - gradle-cache:/home/gradle/.gradle
      # The SQLite metrics file (rollback engine only), unrelated to catalogue-db
      - metrics-db:/var/ceh-catalogue/metrics-db
      # The same fixture shares Hubbub lists (see the hubbub service), read by the data preview
      - ./fixtures/upload/eidchub:/var/ceh-catalogue/data-package:ro
      - ./fixtures/upload/supporting-documents:/var/ceh-catalogue/supporting-documents:ro
    environment:
      DOCUMENTS_BASEURI: http://localhost:8080
      DOI_API: https://api.test.datacite.org/dois
      GEMET_LOCAL: /app/fixtures/vocabs/gemet.json
      ROR_LOCAL: /app/fixtures/solr/ror
      HUBBUB_LOCATION: /app/dropbox
      # Over the compose network: inside this container localhost is the catalogue itself, and 8082
      # is only the port published to the host.
      HUBBUB_URL: http://hubbub:8080/v7
      JENA_LOCATION: /var/ceh-catalogue/jena
      JIRA_SERVICEAGREEMENT_PREFIX: "CT-"
      JIRA_DEPOSITREQUEST_PROJECT: CT
      LOGGING_LEVEL_ROOT: info
      MAPS_LOCATION: /app/mapfiles
      # Data preview on dataset record pages, off unless DATA_PREVIEW_ENABLED=true. Its endpoints
      # exist only under the upload-hubbub Spring profile and list files through Hubbub, so turn it
      # on together with UPLOAD_PROFILE=upload-hubbub and the hubbub compose profile (see
      # SPRING_PROFILES_ACTIVE below); under upload-simple the section would show but never load.
      CATALOGUE_DATA_PREVIEW_ENABLED: ${DATA_PREVIEW_ENABLED:-false}
      CATALOGUE_DATA_PREVIEW_DATA_LOCATION: /var/ceh-catalogue/data-package
      CATALOGUE_DATA_PREVIEW_SUPPORTING_DOCUMENTS_LOCATION: /var/ceh-catalogue/supporting-documents
      # Metrics engine, sqlite by default. For postgres, also start the catalogue-db profile:
      #   METRICS_DATABASE_ENGINE=postgres docker compose --profile postgres up --build
      # The CATALOGUE_DATASOURCE_* values are only read by the postgres engine. The URL has no
      # default in application-metrics.properties, so it must be set here.
      METRICS_DATABASE_ENGINE: ${METRICS_DATABASE_ENGINE:-sqlite}
      CATALOGUE_DATASOURCE_URL: jdbc:postgresql://catalogue-db:5432/catalogue
      CATALOGUE_DATASOURCE_USERNAME: *catalogue_db_user
      CATALOGUE_DATASOURCE_PASSWORD: *catalogue_db_password
      SERVER_PORT: "8090"
      SPRING_FREEMARKER_CACHE: "false"
      SPRING_FREEMARKER_TEMPLATE_LOADER_PATH: file:/app/templates
      SPRING_SERVLET_MULTIPART_LOCATION: /app/dropbox
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: file:/app/static
      UPLOAD_SIMPLE_DATASTORE: /var/ceh-catalogue/datastore
      LEGILO_URL: http://legilo:8000
      # The local legilo container is not behind a proxy and checks no credentials;
      # any non-blank token satisfies the catalogue's start-up check.
      LEGILO_TOKEN: local-dev-token
      HUBBUB_TOKEN: local-dev-token
      FUSEKI_SPARQL_ENDPOINT: http://fuseki:3030/ds/sparql
      FUSEKI_DATASET_URL: http://fuseki:3030/ds
      SPRING_PROFILES_ACTIVE: development,server-eidc,search-basic,service-agreement,${UPLOAD_PROFILE:-upload-simple},metrics
    env_file:
      - path: secrets.env
        required: false
      - path: override.env
        required: false
    ports:
      - "8090:8090"
      - "8091:8091"
    depends_on:
      solr:
        condition: service_started
      catalogue-db:
        condition: service_healthy
        # required: false -- catalogue-db only runs under the "postgres" profile. Without it, a plain
        # `docker compose up` (sqlite engine) would fail because the dependency is not enabled; with
        # it, compose waits for catalogue-db to be healthy when the profile is on and skips it when off.
        # Needs Docker Compose 2.20 or later.
        required: false
    develop:
      watch:
        - action: rebuild
          path: ./build.gradle
        - action: rebuild
          path: ./gradle/libs.versions.toml
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./docker/entrypoint-dev.sh
  web:
    image: node:24-alpine
    # Run as the image's node user (UID 1000) so files written into the bind-mounted
    # ./web (node_modules, css, dist) are owned by the host user, not root.
    user: node
    working_dir: /app/web
    environment:
      # node user's HOME may be unset under an explicit user:, so point npm at a writable cache.
      npm_config_cache: /tmp/.npm
    volumes:
      - ./web:/app/web
      # Read by the build, which keeps only the Font Awesome icons the templates use (dri-one #362)
      - ./templates:/app/templates:ro
    command: sh -c "npm install && npm run watch"
volumes:
  dropbox:
  datastore:
  jena-data:
  gradle-cache:
  metrics-db:
  catalogue-db-data:
