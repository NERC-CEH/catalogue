include:
- template: Jobs/Container-Scanning.gitlab-ci.yml

variables:
  DOCKER_DAEMON_ARGS: -g /cache/docker
  DOCKER_DRIVER: overlay2

stages:
  - test
  - scan
  - build

default:
  before_script:
    - set -euo pipefail

test_java:
  stage: test
  image: gradle:9.5.1-jdk25-alpine
  except:
    - tags
  script: gradle test --no-daemon
  artifacts:
    when: always
    reports:
      junit: java/build/test-results/test/**/TEST-*.xml

test_web:
  stage: test
  image: node:24-alpine
  except:
    - tags
  variables:
    PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
  script:
    - apk add --no-cache chromium
    - export PUPPETEER_EXECUTABLE_PATH=$(which chromium-browser 2>/dev/null || which chromium)
    - cd web/
    - npm ci --no-audit
    - npm run standard
    - npm test
  artifacts:
    when: always
    reports:
      junit: web/TESTS-*.xml

test_application:
  stage: test
  image: docker:27
  except:
    - tags
  before_script:
    - set -euo pipefail
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  services:
    - name: docker:27-dind
      alias: docker
  script:
    - docker build --build-arg BUILD_DATE=$(date +%Y-%m-%d) --target prod -t $CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA

container_scanning:
  stage: scan
  allow_failure: true
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA
    CS_REGISTRY_USER: gitlab-ci-token
    CS_REGISTRY_PASSWORD: $CI_JOB_TOKEN
    CS_SEVERITY_THRESHOLD: 'high'
  before_script:
  - sudo apt-get update -y && sudo apt-get install -y jq
  script:
    - gtcs scan
    - SEVERITY_COUNT=$(jq '.vulnerabilities | map(select(.severity=="High" or .severity=="Critical")) | length' gl-container-scanning-report.json )
    - >
      if [[ $SEVERITY_COUNT -gt 0 ]]; then
        echo "------------------------------------------"
        echo "ERROR: HIGH/CRITICAL SEVERITY VULNERABILITY FOUND"
        echo "------------------------------------------"
        exit 1
      else
        echo "No vulnerabilities found"
      fi

build_application:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - set -euo pipefail
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build --build-arg BUILD_DATE=$(date +%Y-%m-%d) --target prod -t $CI_REGISTRY_IMAGE/app:$CI_COMMIT_REF_NAME .
    # Push only the tag just built. --all-tags pushed every app tag present in the
    # builder's local image store, which is the shared host daemon (the dind service
    # never starts here), so it re-uploaded every $CI_COMMIT_SHA image left behind by
    # test_application: job 89517 pushed 244 tags instead of 1.
    - docker push $CI_REGISTRY_IMAGE/app:$CI_COMMIT_REF_NAME
  only:
    - tags

build_solr:
  extends: build_application
  script:
    - docker build -t $CI_REGISTRY_IMAGE/solr:$CI_COMMIT_REF_NAME solr
    # Same fix as build_application above.
    - docker push $CI_REGISTRY_IMAGE/solr:$CI_COMMIT_REF_NAME
