[versions]
jena = "5.6.0"
ukceh = "2.0.0"
caffeine = "3.2.3"
spring-ai = "2.0.0-M8"

[libraries]
jena-libs = { module = "org.apache.jena:apache-jena-libs", version.ref = "jena" }
jena-geosparql = { module = "org.apache.jena:jena-geosparql", version.ref = "jena" }
mockito = { module = "org.mockito:mockito-core" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
ukceh-datastore = { module = "uk.ac.ceh.components:datastore-git", version.ref = "ukceh" }
ukceh-springsecurity = { module = "uk.ac.ceh.components:springsecurity-userstore", version.ref = "ukceh" }
ukceh-userstore-crowd = { module = "uk.ac.ceh.components:userstore-crowd", version.ref = "ukceh" }
ukceh-inmemory = { module = "uk.ac.ceh.components:userstore-inmemory", version.ref = "ukceh" }
spring-ai-bom     = { module = "org.springframework.ai:spring-ai-bom",                        version.ref = "spring-ai" }
spring-ai-bedrock = { module = "org.springframework.ai:spring-ai-starter-model-bedrock" }
spring-ai-mcp     = { module = "org.springframework.ai:spring-ai-starter-mcp-server-webmvc" }
spring-ai-tika    = { module = "org.springframework.ai:spring-ai-tika-document-reader" }

[bundles]
jena = ["jena-libs", "jena-geosparql"]
ukceh = ["ukceh-datastore", "ukceh-springsecurity", "ukceh-userstore-crowd", "ukceh-inmemory"]
