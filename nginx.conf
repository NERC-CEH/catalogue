server {
  listen 8080;
  #listen [::]:8080;
  server_name localhost;

  client_max_body_size 2G;

  # Browsers probe /favicon.ico at the site root. The application has no mapping for it, so each
  # request costs a 404 plus three WARN lines through ExceptionControllerHandler. On staging and
  # production the proxy serves the favicon and the application never sees the request; this gives
  # local development the same treatment by pointing it at a logo the application already serves.
  # An exact-match location is evaluated ahead of the catch-all "location /" regardless of ordering.
  # proxy_pass is used rather than "rewrite ... last": a rewrite re-enters location matching and is
  # finally handled by "location /", and nginx writes its access-log entry from the location that
  # handles the request, so access_log off here would have no effect.
  location = /favicon.ico {
    access_log off;
    log_not_found off;
    proxy_pass http://catalogue:8090/static/img/cataloguelogo/ukceh.png;
  }

  # The Dev Bar's script, served rather than inlined into each page so the Content-Security-Policy
  # (script-src 'self', no inline scripts without a nonce) allows it (dri-one #454)
  location = /devbar.js {
    default_type application/javascript;
    return 200 '{
  const select = document.querySelector("#setremoteuser");
  select.value = (document.cookie.match(/(?:^|; )remoteuser=([^;]*)/) || [])[1] || "";
  select.addEventListener("change", e => {
    document.cookie = "remoteuser=" + e.target.value + "; path=/";
    location.reload();
  });
}
';
  }

  location / {
    sub_filter </head>
        '</head>
<div id="devbar" >
    <span class="title" >
        Dev Bar
    </span>
    <label for="remoteuser">User: </label>
    <select name="remoteuser" id="setremoteuser" >
        <option value="superadmin">superadmin</option>
        <option value="eidc-editor">eidc-editor</option>
        <option value="eidc-publisher">eidc-publisher</option>
        <option value="infrastructure-editor">infrastructure-editor</option>
        <option value="infrastructure-publisher">infrastructure-publisher</option>
        <option value="ukceh-editor">ukceh-editor</option>
        <option value="ukceh-publisher">ukceh-publisher</option>
        <option value="ukeof-publisher">ukeof-publisher</option>
        <option value="datalabs-editor">datalabs-editor</option>
        <option value="datalabs-publisher">datalabs-publisher</option>
        <option value="unprivileged" selected>unprivileged</option>
        <option value="" selected>none</option>
=    </select>
    <style>
        #devbar {
            padding: 1rem;
            background-color: #d8dee9;
            color: #4c566a;
            border-bottom: #0000002e solid 2px;

            .title {
                padding: 10px;
                margin-right: 1rem;
                font-weight: bold;
                border-right: #4c566a2e solid 2px;
            }
        }

        #search {
            .results {
                margin-bottom: 5rem;
            }
        }
    </style>
    <script src="/devbar.js"></script>
</div>';

    proxy_set_header Remote-User $cookie_remoteuser;
    proxy_set_header Host localhost:8080;
    # Set a test IP for development to simulate real browser IP
    proxy_set_header X-Forwarded-For "203.0.113.45";
    proxy_set_header X-Client-IP "203.0.113.46";
    proxy_pass http://catalogue:8090/;
  }
}
