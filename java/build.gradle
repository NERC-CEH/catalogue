//file:noinspection GradlePackageUpdate
plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.freefair.lombok' version '9.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

repositories {
    mavenCentral()
    maven {
        // https://gitlab.ceh.ac.uk/commons/java-commons (public)
        url = "https://gitlab.ceh.ac.uk/api/v4/projects/10/packages/maven"
    }
}

configurations {
    mockitoAgent
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

bootJar {
    archiveFileName = 'app.jar'
}

compileJava {
    options.compilerArgs += ['-Xlint:deprecation', '-parameters']
    options.incremental = true
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation(libs.caffeine)
    implementation 'org.springframework.boot:spring-boot-starter-freemarker'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Replaces bare spring-jdbc: brings HikariCP, plus the DataSourceProperties and DataSourceBuilder
    // that bind spring.datasource.* and spring.datasource.hikari.*. It also brings
    // DataSourceAutoConfiguration, which applies to every profile and does not suit a datasource that
    // only exists under "metrics", so it is excluded on CatalogueApplication and NOT re-imported
    // anywhere -- re-importing it inside a profile does not bring it back. MetricsDatabaseConfig builds
    // the pool by hand instead, through the same binding. Do not drop that exclusion without reading
    // the javadoc there -- without it, the non-metrics contexts fail at startup.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // Spring Security
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'

    // Apache
    implementation(libs.bundles.jena)
    implementation "org.apache.solr:solr-solrj:10.0.0"

    // Spring AI — Bedrock Titan embeddings, MCP server, Tika document extraction
    implementation platform(libs.spring.ai.bom)
    implementation libs.spring.ai.bedrock
    implementation libs.spring.ai.mcp
    implementation libs.spring.ai.tika    // PDF/Word/RTF supporting document extraction

    // CEH Components
    implementation(libs.bundles.ukceh)

    // OpenAPI
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3"

    // Third-party
    implementation 'tools.jackson.datatype:jackson-datatype-guava'
    implementation 'com.google.guava:guava:33.4.8-jre'
    implementation 'com.jayway.jsonpath:json-path'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.9'
    implementation 'com.opencsv:opencsv:5.12.0'
    implementation 'com.vividsolutions:jts:1.13'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.hibernate.validator:hibernate-validator'
    // Retained only for the metrics.database.engine=sqlite rollback path. Drop it, together with
    // MetricsDatabaseConfig.SqliteMetricsDatabase and metrics.database.busy-timeout-millis, once the
    // PostgreSQL migration (#236) has been verified in production and the rollback window closes.
    implementation 'org.xerial:sqlite-jdbc'
    implementation 'org.yaml:snakeyaml'

    // Driver only — no compile-time dependency on it anywhere. Version managed by the Boot BOM.
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation(libs.mockito)
    mockitoAgent(libs.mockito) { transitive = false}

    testImplementation 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // JDBCMetricsServicePostgresTest: the metrics service against a real postgres:14.24-alpine, since H2
    // silently accepts type mismatches PostgreSQL rejects. Testcontainers 2.x artifact names (the
    // "testcontainers-" prefix; PostgreSQLContainer lives in org.testcontainers.postgresql). Versions
    // managed by the Boot BOM. The test skips itself when Docker is not available.
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.xmlunit:xmlunit-core'
    testImplementation 'org.xmlunit:xmlunit-matchers'
}

tasks {
    test {
        useJUnitPlatform()
        jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
        // FreeMarker resolves templates/ at runtime via a plain file: path (application-test.properties),
        // not through a Gradle source set, so without this the task has no idea its behaviour depends on
        // it: a template-only edit left this task UP-TO-DATE, reporting a false pass. Declaring it here
        // folds the directory's contents into the task's input fingerprint, for both up-to-date checking
        // and the local build cache key (see settings.gradle).
        inputs.dir(rootProject.file('templates'))
            .withPropertyName('templates')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    }
}
