# MCP server configuration — activated by the "mcp-server" profile.
# Exposes catalogue search tools to external LLMs over HTTP.
#
# Overrides the spring.ai.mcp.server.enabled=false in application.properties, which is
# what keeps the server out of every other profile.
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.annotation-scanner.enabled=true
# DO NOT DELETE AS REDUNDANT. Spring AI 2.0.1 carries two disagreeing defaults for this key:
#
#   McpServerProperties.protocol      field default = STREAMABLE  (what the reference docs and
#                                                                  spring-configuration-metadata
#                                                                  report, and what the bound
#                                                                  properties bean returns)
#   @ConditionalOnProperty selection  unset => SSE                (only EnabledSseServerCondition
#                                                                  carries matchIfMissing=true;
#                                                                  the STREAMABLE and STATELESS
#                                                                  conditions do not)
#
# The transport is chosen by the conditions, which are evaluated while bean definitions are
# registered and read the raw Environment -- they never see the field default, which is only
# applied later at binding time. So leaving this unset mounted SSE, the transport deprecated in
# Spring AI 2.0, while every piece of documentation said Streamable HTTP. Verified against the
# ConditionEvaluationReport, which reported "@ConditionalOnProperty
# (spring.ai.mcp.server.protocol=STREAMABLE) did not find property 'protocol'" against
# McpServerStreamableHttpWebMvcAutoConfiguration while the SSE condition matched the same
# absent property. McpServerContextTest pins which transport is mounted.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=ukceh-catalogue
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
