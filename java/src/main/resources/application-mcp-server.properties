# MCP server configuration — activated by the "mcp-server" profile.
# Exposes catalogue search tools to external LLMs over Streamable HTTP at /mcp
# (spring.ai.mcp.server.protocol defaults to "streamable"; the older SSE transport
# is deprecated in Spring AI 2.0).
spring.ai.mcp.server.name=ukceh-catalogue
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
