# ROR requires a client id from Q3 2026: identified clients keep 2,000 requests
# per 5 minutes, unidentified ones drop to 50. Sent as the Client-Id header.
# Blank because registration is paused, not because we chose not to register:
# https://ror.org/api-client-id currently says client id registration is
# temporarily paused and that the new limits are not yet being enforced. Fill
# this in once registration reopens.
ror.clientId=
# How many organisations one export may fetch from ROR while unidentified.
# 200 fills all 561 in three daily runs, after which only the ~40 a day that
# age out are fetched at all -- inside even the 50-per-5-minutes limit that
# will apply to an unidentified client once enforcement starts. Lower this to
# 40 if that happens before a client id can be obtained; the only exposure is
# a first fill, and it costs extra runs rather than correctness.
ror.unidentifiedRequestsPerRun=200
# How many people one export may fetch from ORCID. ORCID publishes no limit we
# could find and returns no rate-limit headers, so this is a politeness figure
# rather than a required one -- 500 fills the 2,125 referenced today in five
# daily runs. It obeys the same convergence rule as the ROR budget: a first
# fill must finish inside the fortnight refresh window, so this caps the
# referenced set at 500 x 14 = 7,000 people. Raise it before then; a test
# fails if the recorded count outgrows it.
orcid.requestsPerRun=500
# Third-party authorities (ORCID, ROR, the SKOS vocabularies) are reached with
# these timeouts. The export makes hundreds of outbound calls per run, so an
# authority that accepts a connection and then never answers must not be able
# to hold the export thread open indefinitely.
authorities.connectTimeout=10s
authorities.readTimeout=30s
# Where cached authority descriptions live. Blank keeps them in memory, so they
# are refetched after a restart. This path is deliberately NOT on a persistent
# volume: every PV in the cluster is a CIFS share mounted nobrl, and TDB2 needs
# the byte-range locking that option removes.
jena.descriptionCache.location=/var/ceh-catalogue/description-cache
# What does go on the share is a snapshot of that store -- one N-Quads file,
# written whole and read whole, so no locking or memory mapping is involved.
# Without it a recreated pod starts cold and spends several days refetching
# 2,686 entities, during which the identity graphs are held back rather than
# published half-filled. Blank disables it.
#
# It shares the vocabs volume rather than claiming one of its own: that is the
# only mounted path holding external reference data the catalogue caches, and
# the file is a few megabytes against 1Gi. A dedicated PVC would be tidier.
jena.descriptionCache.snapshot=/var/ceh-catalogue/vocabs/description-cache.nq
# The Wikidata Query Service. Phase 5 of dri-one #350 batches against this
# rather than dereferencing: one entity's RDF is 324KB, so asking about the
# 2,064 referenced entities individually would move ~670MB to extract labels,
# where 500 in one CONSTRUCT measured 10 seconds and 109KB.
wikidata.endpoint=https://query.wikidata.org/sparql
# WDQS asks every client to identify itself and blocks those that do not, so
# this is a requirement rather than a courtesy. Keep a working contact in it.
wikidata.userAgent=ukceh-catalogue-export/1.0 (https://catalogue.ceh.ac.uk; enquiries@ceh.ac.uk)
# 500 measured at 10 seconds against the 30 second authorities.readTimeout.
wikidata.batchSize=500
# Eight queries covers the referenced set five times over, so a first fill
# completes in one run and there is headroom as the set grows.
wikidata.queriesPerRun=8
