# Threads available to @Scheduled work. Boot's default is 1, which put all thirteen scheduled methods
# -- the three 30-minute index checks, the daily Fuseki export and Turtle dump, the weekly vocabulary
# refreshes, the metrics sync -- plus SolrScheduledReindexService's startup retry chain on a single
# thread. fixedDelay means runs cannot overlap, so the cost was delay rather than pile-up, and the
# delay is not symmetric: a Fuseki export starting with a cold description cache makes ~1,660
# outbound requests at up to authorities.readTimeout each, and while it held the one thread the
# index checks queued behind it -- including the empty-index check that is the only repair for an
# unpopulated Solr or Jena. Four decouples the export from those repair paths. Nothing scheduled here
# is CPU-bound, so the three normally-idle threads cost a stack each. See docs/scheduled-tasks.md.
spring.task.scheduling.pool.size=4
# Let a task that is running when SIGTERM arrives finish, instead of being interrupted part-way.
# Unset, Spring calls shutdownNow() on the scheduler: the running task is interrupted at an arbitrary
# point and the queue is discarded. Note that graceful web-server shutdown does NOT cover this --
# server.shutdown (already "graceful" by default in Boot 4) holds open in-flight HTTP requests and
# says nothing about scheduled-task state.
spring.task.scheduling.shutdown.await-termination=true
# The budget for that wait is a total, not a per-task one: with a pool of 4 it waits for every pool
# thread. It has to fit inside the container's termination grace period -- the Kubernetes default of
# 30s, not overridden in either manifest -- with room for the JVM to exit afterwards, or the pod is
# SIGKILLed mid-task and the wait bought nothing. Boot truncates this to whole seconds.
spring.task.scheduling.shutdown.await-termination-period=20s
