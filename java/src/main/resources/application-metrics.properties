# The metrics database, read only when the "metrics" profile is active. Add "metrics" to
# SPRING_PROFILES_ACTIVE to activate.
#
# Everything here except the health setting at the end is for metrics.database.engine=postgres. It is
# inert under the default sqlite engine: only the postgres branch of MetricsDatabaseConfig binds these,
# so under sqlite they are just unread properties.
#
# DataSourceAutoConfiguration is excluded on CatalogueApplication and is NOT re-imported anywhere --
# re-importing it inside a profile does not work (see the MetricsDatabaseConfig javadoc). The postgres
# branch builds the Hikari pool by hand instead, but binds it through the same DataSourceProperties and
# DataSourceBuilder the auto-configuration would use, which is why these are still spring.datasource.*
# and spring.datasource.hikari.*. Keeping them in the profile-specific file rather than
# application.properties is what leaves the other contexts with no spring.datasource.url anywhere.
#
# METRICS_DATASOURCE_*, deliberately NOT METRICS_DATABASE_URL: that variable belongs to the SQLite
# path. Separate variables mean an environment can carry both sets at once, so switching engine is a
# one-value change in the ConfigMap -- which is the point of keeping SQLite selectable. Sharing one
# would hand a jdbc:postgresql:// URL to the SQLite driver on rollback.
#
# No committed credentials: values come from the environment, populated from the existing Kubernetes
# secret mechanism. The defaults are the docker-compose metrics-db service for local development, as
# seen from the host -- port 5434, the one docker-compose.yml publishes, because hubbub-db already binds
# 5432 and otherwise the two cannot both run.
spring.datasource.url=${METRICS_DATASOURCE_URL:jdbc:postgresql://localhost:5434/metrics}
spring.datasource.username=${METRICS_DATASOURCE_USERNAME:metrics}
spring.datasource.password=${METRICS_DATASOURCE_PASSWORD:metrics}

# Pool sizing. Small deliberately: reads are two queries per record page render, both behind the
# 10-minute Caffeine caches (#242), and the only other users are the hourly syncDB and the daily
# updateDB. Eight leaves headroom for a burst of uncached renders while staying well inside whatever
# max_connections the shared VM ends up with (#249).
spring.datasource.hikari.pool-name=metrics-pool
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2

# STARTUP-FAILURE POLICY: the catalogue starts even when the metrics database is unreachable, so an
# unavailable database costs the metrics counters and nothing else. Failing the context instead would
# turn a routine PostgreSQL patch window on the VM into a catalogue outage, with the pod crash-looping
# against a 300s startup-probe budget. This matches the read path, which already returns null on
# DataAccessException (#232) rather than 500ing the record page.
#
# What actually enforces it is JDBCMetricsService: its constructor runs no SQL, and ensureSchema
# catches DataAccessException. Not this setting -- the pool is built lazily on first use either way,
# and with Hikari's default (1ms) a failed first connection surfaces as the same SQLException, so
# startup survives with or without it. -1 is kept because it lets the pool itself come up while the
# database is down and fill in the background once it returns, rather than every caller retrying pool
# creation.
spring.datasource.hikari.initialization-fail-timeout=-1

# 2s, deliberately short: a record page render waiting on an exhausted pool or an unreachable host has
# to give up quickly enough for JDBCMetricsService.totalAmount to return null and let the page render
# without a count. The same value bounds how long startup waits when the database is down, since the
# schema is attempted once on ApplicationReadyEvent.
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
# connection-timeout only bounds the wait for a connection from the pool. pgjdbc's own socketTimeout
# defaults to 0 (wait forever), so a pooled connection whose peer vanishes without a reset (VM pause,
# firewall drop, failover) would hold a record-page render until the kernel's TCP timeout, many
# minutes. Seconds, not milliseconds. Every query here is a single indexed lookup or a small insert;
# the report is the slowest and is admin-only.
spring.datasource.hikari.data-source-properties.socketTimeout=10
# Replace connections the network has quietly severed (firewall idle timeout, failover) instead of
# handing a dead one to a caller and failing on first use.
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=1800000

# No "db" health indicator for the metrics datasource. spring-boot-starter-jdbc contributes one for any
# DataSource bean, which would take the aggregate /actuator/health DOWN whenever the metrics database
# is, against the policy above, and open a connection (on SQLite, to the file on the CIFS share) on
# every health check. The Kubernetes probes use the liveness and readiness groups, which leave it out
# by default, so this changes nothing for them.
management.health.db.enabled=false
