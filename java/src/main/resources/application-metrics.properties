# The metrics database, read only when the "metrics" profile is active. Add "metrics" to
# SPRING_PROFILES_ACTIVE to activate.
#
# Everything here is for metrics.database.engine=postgres. It is inert under the default sqlite
# engine: MetricsDatabaseConfig only imports DataSourceAutoConfiguration on the postgres branch, so
# with no consumer these values are just unread properties.
#
# They are spring.datasource.* because the pool is built by that auto-configuration rather than by
# hand. Keeping them in the profile-specific file rather than application.properties is what leaves
# the other contexts with no spring.datasource.url anywhere, which is the state the exclusion on
# CatalogueApplication relies on.
#
# METRICS_DATASOURCE_*, deliberately NOT METRICS_DATABASE_URL: that variable belongs to the SQLite
# path. Separate variables mean an environment can carry both sets at once, so switching engine is a
# one-value change in the ConfigMap -- which is the point of keeping SQLite selectable. Sharing one
# would hand a jdbc:postgresql:// URL to the SQLite driver on rollback.
#
# No committed credentials: values come from the environment, populated from the existing Kubernetes
# secret mechanism. The defaults are the docker-compose service for local development -- host port
# 5433, because hubbub-db already binds 5432 and otherwise the two cannot both run.
spring.datasource.url=${METRICS_DATASOURCE_URL:jdbc:postgresql://localhost:5433/metrics}
spring.datasource.username=${METRICS_DATASOURCE_USERNAME:metrics}
spring.datasource.password=${METRICS_DATASOURCE_PASSWORD:metrics}

# Pool sizing. Small deliberately: reads are two queries per record page render, both behind the
# 10-minute Caffeine caches (#242), and the only other users are the hourly syncDB and the daily
# updateDB. Eight leaves headroom for a burst of uncached renders while staying well inside whatever
# max_connections the shared VM ends up with (#249).
spring.datasource.hikari.pool-name=metrics-pool
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2

# STARTUP-FAILURE POLICY, stated rather than inherited: the catalogue starts even when the metrics
# database is unreachable. -1 tells Hikari not to open a connection while the pool is being built, so
# an unavailable database costs the metrics counters and nothing else. Failing the context instead
# would turn a routine PostgreSQL patch window on the VM into a catalogue outage, with the pod
# crash-looping against a 300s startup-probe budget. This matches the read path, which already returns
# null on DataAccessException (#232) rather than 500ing the record page.
spring.datasource.hikari.initialization-fail-timeout=-1

# 10s for local development. The 2s timeout is too short for Docker networking during startup.
# In production with a stable network, 2s is appropriate to fail fast.
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
# Replace connections the network has quietly severed (firewall idle timeout, failover) instead of
# handing a dead one to a caller and failing on first use.
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=1800000
