spring.cache.type=none
data.repository.location=../datastore
spring.freemarker.template-loader-path=file:../templates
crowd.password=dummy
doi.password=test
hubbub.password=rubbish
jira.token=test-token
# blank keeps the authority-description cache in memory for tests
jena.descriptionCache.location=
# No snapshot in tests: nothing may read or write a real path under /var.
jena.descriptionCache.snapshot=
# Nothing in the test suite may reach the live Query Service.
wikidata.endpoint=http://wikidata.invalid/sparql
wikidata.userAgent=ukceh-catalogue-test/1.0 (test)

# Scheduled work does not run in tests at all. See docs/scheduled-tasks.md and dri-one #356.
#
# @EnableScheduling used to sit on CatalogueApplication, so every @SpringBootTest built a context
# with a real scheduler and the real @Scheduled methods attached, and Spring caches those contexts
# for the lifetime of the test JVM. Every ungated scheduled method has an initialDelay of one to five
# minutes -- shorter than a suite run -- so the suite genuinely downloaded the GEMET and ROR
# vocabularies, ran the SPARQL keyword retrievals, attempted Jena and MapServer reindexes and
# prefetched Turtle for whole catalogues, against live endpoints, from every cached context.
#
# This switches off registration rather than capping the damage: the beans are still built, so the
# wiring assertions still hold, but nothing they declare is ever scheduled.
catalogue.scheduling.enabled=false
