spring.cache.type=none
data.repository.location=../datastore
spring.freemarker.template-loader-path=file:../templates
crowd.password=dummy
doi.password=test
hubbub.password=rubbish
jira.token=test-token
# blank keeps the authority-description cache in memory for tests
jena.descriptionCache.location=
# No snapshot in tests: nothing may read or write a real path under /var.
jena.descriptionCache.snapshot=
# Nothing in the test suite may reach the live Query Service.
wikidata.endpoint=http://wikidata.invalid/sparql
wikidata.userAgent=ukceh-catalogue-test/1.0 (test)

# Scheduling is a production concern; the suite must not pay for it. See docs/scheduled-tasks.md.
#
# @EnableScheduling sits on CatalogueApplication, so every @SpringBootTest gets a real scheduler, and
# Spring caches those contexts for the whole JVM run. Every ungated @Scheduled method has an
# initialDelay of 1-5 minutes -- shorter than the suite -- so the GEMET, ROR and SPARQL vocabulary
# retrievals, the Jena and MapServer reindex checks and the Turtle prefetch genuinely execute during
# the tests, against real endpoints. That leak is older than these two lines and is not fixed here.
#
# What these lines do is stop the production values making it fatal:
#  - a pool of 4 lets four of those run at once in each cached context, and a Gradle test worker gets
#    512m by default -- concurrently enough of them to exhaust it (OutOfMemoryError in an unrelated
#    context load);
#  - await-termination replaces shutdownNow() with a 20s wait per context close, and since those
#    retrievals sit blocked on network reads, every context burns the full budget at JVM shutdown.
# Restoring Boot's defaults here restores the behaviour the suite had before dri-one #354.
#
# The shipped production values are asserted by SchedulingConfigTest, which reads the real
# application.properties through ConfigDataApplicationContextInitializer with no profile active, so
# nothing in this file weakens that coverage.
spring.task.scheduling.pool.size=1
spring.task.scheduling.shutdown.await-termination=false
