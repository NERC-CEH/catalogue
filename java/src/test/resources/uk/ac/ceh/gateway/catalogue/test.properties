# Only read under the "metrics" profile (MetricsDatabaseConfig), so the production-context tests can
# activate that profile without needing the CIFS-mounted database path to exist.
#
# A file under build/ rather than ":memory:": MetricsDatabaseConfig supplies a bare SQLiteDataSource
# with no connection pool, so every statement opens its own connection, and each connection to an
# in-memory SQLite database gets a private empty one. The schema created by one statement would be
# invisible to the next.
metrics.database.url=jdbc:sqlite:build/metrics-context-test.db


# As application-test.properties, repeated because the three production-context tests deliberately
# leave the "test" profile off -- that is the point of them -- so the profile-specific file never
# reaches them. They are also the contexts that matter most here: SolrScheduledReindexService is
# @Profile("!test"), so these are the only ones that load it, and it schedules its startup retry
# chain programmatically rather than through @Scheduled. SchedulingConfig supplies a discarding
# TaskScheduler when this is false, which is what stops that chain and keeps the injection point
# satisfied. See docs/scheduled-tasks.md and dri-one #356.
catalogue.scheduling.enabled=false
