# Only read under the "metrics" profile (MetricsDatabaseConfig), so the production-context tests can
# activate that profile without needing the CIFS-mounted database path to exist.
#
# A file under build/ rather than ":memory:": MetricsDatabaseConfig supplies a bare SQLiteDataSource
# with no connection pool, so every statement opens its own connection, and each connection to an
# in-memory SQLite database gets a private empty one. The schema created by one statement would be
# invisible to the next.
metrics.database.url=jdbc:sqlite:build/metrics-context-test.db
